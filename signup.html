<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f45b69"><title>Sign Up · CrumbCircle</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%23f45b69'/%3E%3Cpath d='M30 58c4-17 36-17 40 0v11H30z' fill='white'/%3E%3C/svg%3E">
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Playfair+Display:wght@700&display=swap');
:root{--ink:#281d1b;--muted:#756a66;--cream:#fffaf3;--rose:#f45b69;--gold:#f6c453;--line:#eadfd7}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#fff 0,#fffaf3 52%,#f8eae2 100%);font-family:"DM Sans",sans-serif;color:var(--ink);display:grid;place-items:center;padding:24px;overflow-x:hidden}
.wrap{width:min(480px,100%);text-align:center}.brand{display:inline-flex;align-items:center;justify-content:center;gap:11px;text-decoration:none;color:var(--ink);font-weight:800;font-size:20px;margin-bottom:18px}
.logo{width:52px;height:52px;border-radius:17px;background:linear-gradient(145deg,#ff7c86,#e9475a);display:grid;place-items:center;position:relative;overflow:hidden;box-shadow:inset 3px 3px 8px rgba(255,255,255,.48),inset -6px -7px 12px rgba(93,16,28,.32),0 13px 28px rgba(244,91,105,.3)}
.logo:before{content:"";position:absolute;inset:5px;border:1px solid rgba(255,255,255,.45);border-radius:12px}.logo:after{content:"";position:absolute;inset:-40%;background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.75) 50%,transparent 58%);animation:sweep 3.5s infinite}.logo svg{width:36px;position:relative;z-index:2}
.card{background:#fff;border:1px solid var(--line);border-radius:30px;padding:34px 32px;box-shadow:0 25px 65px rgba(55,34,27,.13);text-align:center}
h1{font:700 43px/1 "Playfair Display",serif;letter-spacing:-.04em;margin:7px 0 12px}p{color:var(--muted);line-height:1.6;margin:0 auto 22px}
.field{text-align:left;margin-top:14px}.field label{font-size:13px;font-weight:700;display:block;margin-bottom:7px}.field input{width:100%;height:49px;border:1px solid var(--line);border-radius:13px;background:#fffaf7;padding:0 14px;outline:none}.field input:focus{border-color:var(--rose);box-shadow:0 0 0 4px rgba(244,91,105,.09)}
.check{text-align:left;color:var(--muted);font-size:13px;margin-top:15px;line-height:1.5}.check input{accent-color:var(--rose)}
.btn{width:100%;height:50px;border:0;border-radius:14px;margin-top:18px;background:var(--rose);color:#fff;font-weight:800;cursor:pointer;box-shadow:0 13px 25px rgba(244,91,105,.24);transition:.25s}.btn:hover{transform:translateY(-2px)}
.links{margin-top:17px;font-size:13px;color:var(--muted)}a{color:var(--rose);font-weight:700;text-decoration:none}.back{display:inline-block;margin-top:20px;color:var(--muted);font-size:13px}
@keyframes sweep{0%,42%{transform:translateX(-75%) rotate(8deg)}68%,100%{transform:translateX(75%) rotate(8deg)}}
@media(max-width:520px){body{padding:14px}.card{padding:27px 18px}h1{font-size:38px}}
</style></head>
<body>
<div class="wrap">
<a class="brand" href="index.html" aria-label="Go to CrumbCircle home">
<span class="logo"><svg viewBox="0 0 64 64"><path d="M13 37c0-7 5-11 11-11h16c6 0 11 4 11 11v13H13z" fill="#fff"/><path d="M19 32c1-8 8-12 13-12s12 4 13 12" fill="none" stroke="#f6c453" stroke-width="4" stroke-linecap="round"/><path d="M25 24c1-6 4-9 7-11M39 24c-1-6-4-9-7-11" stroke="#fff" stroke-width="3" stroke-linecap="round"/><circle cx="24" cy="35" r="2.1" fill="#f45b69"/><circle cx="32" cy="33" r="2.1" fill="#f45b69"/><circle cx="40" cy="35" r="2.1" fill="#f45b69"/></svg></span>
CrumbCircle</a>
<div class="card">
<h1>Join CrumbCircle</h1><p>Create your food discovery profile.</p>
<div class="field"><label>Full name</label><input placeholder="Your name"></div>
<div class="field"><label>Email</label><input type="email" placeholder="you@example.com"></div>
<div class="field"><label>Password</label><input type="password" placeholder="Create a password"></div>
<div class="check"><label><input type="checkbox" required> I agree to the Terms & Community Guidelines.</label></div>
<button class="btn" onclick="location.href='dashboard.html'">Create account</button>
<div class="links">Already a member? <a href="login.html">Log in</a></div>
<a class="back" href="index.html">← Back to home</a>
</div></div></body></html>
